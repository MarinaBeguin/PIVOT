<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIVOT scene</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #111418; --panel: #1b2027cc; --text: #e6e8eb; --muted: #9aa3ad; --accent: #4cc38a;
          --warn: #f5a524; --bad: #e5484d; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  .panel { position: absolute; top: 12px; max-height: calc(100% - 24px); overflow: auto; z-index: 5;
           background: var(--panel); border-radius: 8px; padding: 12px 14px; backdrop-filter: blur(6px); }
  body.no-labels .tag:not(.room) { display: none; }
  /* Phones: the room fills the screen; the panels are drawers opened from a bar at the bottom. */
  #mobileNav { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; gap: 6px;
               padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: #1b2027f2;
               border-top: 1px solid #fff2; }
  #mobileNav button { flex: 1; padding: 9px 4px; font-size: 14px; }
  #mobileNav button.active { background: var(--accent); color: #0b1a12; border-color: var(--accent); }
  @media (max-width: 720px) {
    #mobileNav { display: flex; }
    #panel, #controls { position: fixed; top: auto; left: 0; right: 0; bottom: calc(56px + env(safe-area-inset-bottom));
             width: auto !important; max-height: 52vh; border-radius: 14px 14px 0 0;
             box-sizing: border-box; display: none !important; }
    body.sheet-panel #panel, body.sheet-move #controls, body.sheet-chat #controls { display: block !important; }
    body.sheet-move #chat { display: none !important; }
    body.sheet-chat #moveSection { display: none; }
    body.sheet-chat #chat { margin-top: 0; border-top: none; padding-top: 0; }
    #chatLog { max-height: 24vh; }
    /* A handle: the drawer is swiped down to close. */
    #panel::before, #controls::before { content: ""; display: block; width: 40px; height: 4px;
             margin: -4px auto 8px; border-radius: 2px; background: #fff4; }
    .tag { font-size: 10px; padding: 0 4px; }
    /* The long explanation is in the tour; the drawer keeps the controls. */
    #moveSection > .hint { display: none; }
  }
  #panel { left: 12px; width: 260px; }
  #controls { right: 12px; width: 290px; display: none; }
  .panel h1 { font-size: 15px; margin: 0 0 4px; }
  #sceneMenu, #languageMenu { width: 100%; margin: 4px 0 6px; background: #0006; color: var(--text);
               border: 1px solid #fff3; border-radius: 4px; padding: 4px 6px; font: inherit; }
  #languageMenu { margin: 10px 0 0; }
  .panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .panel label { display: block; margin: 4px 0; cursor: pointer; }
  .tag { font-size: 11px; padding: 1px 5px; border-radius: 3px; background: #000a;
         color: #fff; white-space: nowrap; pointer-events: none; }
  .tag.room { font-size: 13px; font-weight: 600; background: #ffffffd0; color: #1d2421; }
  .row { display: flex; gap: 6px; margin: 6px 0; align-items: center; }
  /* Buttons in equal columns, so that every row spans the panel and none sticks out. */
  .grid { display: grid; gap: 6px; margin: 6px 0; }
  .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid button { width: 100%; min-width: 0; overflow-wrap: anywhere; }
  .sizeForm { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 6px;
              align-items: center; margin: 6px 0; }
  .sizeForm .key { grid-column: 1 / -1; color: var(--muted); }
  .sizeForm input { width: 100%; box-sizing: border-box; }
  .row .key { color: var(--muted); width: 64px; flex: none; }
  input[type=number] { width: 80px; background: #0006; color: var(--text); border: 1px solid #fff3;
                       border-radius: 4px; padding: 3px 6px; }
  button { background: #ffffff1a; color: var(--text); border: 1px solid #fff3; border-radius: 4px;
           padding: 5px 10px; cursor: pointer; }
  button:hover { background: #ffffff2a; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: var(--accent); color: #0b1a12; border-color: var(--accent); }
  #result { margin-top: 10px; font-size: 13px; white-space: pre-wrap; }
  #result .ok { color: var(--accent); font-weight: 600; }
  #result .no { color: var(--bad); font-weight: 600; }
  #chatLimits.no { color: var(--bad); font-weight: 600; }
  .hint { color: var(--muted); font-size: 12px; }
  #chat { display: none; margin-top: 14px; border-top: 1px solid #fff2; padding-top: 10px; }
  #chatLog { max-height: 260px; overflow: auto; font-size: 13px; margin-bottom: 12px; }
  #chatLog .user { margin: 8px 0 2px; color: var(--accent); }
  #chatLog .agent { white-space: pre-wrap; }
  #chatLog .tools { color: var(--muted); font-size: 11px; margin-top: 2px; }
  #chatInput { width: 100%; box-sizing: border-box; min-height: 48px; background: #0006;
               color: var(--text); border: 1px solid #fff3; border-radius: 4px; padding: 5px 6px;
               font: inherit; resize: vertical; }
  #chatMic.recording { background: var(--bad); border-color: var(--bad); color: #fff; }
  #chat label { font-size: 12px; color: var(--muted); }
  /* First-visit tour: comic speech bubbles pointing at each part of the page. */
  #tour { position: fixed; inset: 0; z-index: 20; background: #0007; display: none; }
  /* The size of an object from a photo is checked in a dialog before it is placed. */
  #sizeDialog { position: fixed; inset: 0; z-index: 20; background: #0009; display: none;
                align-items: center; justify-content: center; padding: 16px; }
  #sizeDialog .card { background: var(--panel); border: 2px solid var(--accent); border-radius: 12px;
                      padding: 16px; max-width: 380px; width: 100%; box-sizing: border-box; }
  #sizeDialog h2 { margin: 0 0 8px; font-size: 17px; }
  #sizeDialog img { display: block; max-width: 100%; max-height: 30vh; margin: 0 auto 10px;
                    border-radius: 6px; background: #fff1; }
  #sizeDialog .grid { margin-top: 12px; }
  #sizeDialog .choices { display: grid; gap: 6px; margin: 12px 0; }
  #sizeDialog .choices button { text-align: left; }
  #tour .bubble { position: absolute; max-width: 300px; padding: 14px 16px 12px;
    background: #fffdf3; color: #1d2421; border: 2.5px solid #1d2421; border-radius: 22px;
    box-shadow: 4px 5px 0 #1d2421; font: 15px/1.45 "Comic Neue", "Comic Sans MS", system-ui, sans-serif; }
  #tour .bubble::before, #tour .bubble::after { content: ""; position: absolute; border: solid transparent; }
  #tour .bubble.left::before { right: 100%; top: 26px; border-width: 12px 18px 12px 0; border-right-color: #1d2421; }
  #tour .bubble.left::after { right: calc(100% - 4px); top: 29px; border-width: 9px 14px 9px 0; border-right-color: #fffdf3; }
  #tour .bubble.right::before { left: 100%; top: 26px; border-width: 12px 0 12px 18px; border-left-color: #1d2421; }
  #tour .bubble.right::after { left: calc(100% - 4px); top: 29px; border-width: 9px 0 9px 14px; border-left-color: #fffdf3; }
  #tour .bubble.down::before { top: 100%; left: 40px; border-width: 18px 12px 0 12px; border-top-color: #1d2421; }
  #tour .bubble.down::after { top: calc(100% - 4px); left: 43px; border-width: 14px 9px 0 9px; border-top-color: #fffdf3; }
  #tour .bubble .steps { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  #tour .bubble .dots { color: #9aa3ad; letter-spacing: 2px; }
  #tour .bubble button { color: #1d2421; border-color: #1d2421; background: transparent; font: inherit; }
  #tour .bubble button.primary { background: var(--accent); }
  /* The panel holding the part shown rises above the shade; the part itself is outlined. */
  .tour-raise { z-index: 21; }
  .tour-focus { box-shadow: 0 0 0 3px var(--accent); border-radius: 8px; }
  /* Bottom left: the right-hand panel can reach the bottom of the window and hide it. */
  #tourButton { position: fixed; left: 12px; bottom: 12px; z-index: 10; width: 34px; height: 34px;
    border-radius: 50%; padding: 0; font-weight: 700; font-size: 16px; background: var(--panel); }
  /* On phones the bottom bar takes the bottom: top right, over the room. */
  @media (max-width: 720px) { #tourButton { left: auto; right: 12px; top: 12px; bottom: auto; } }
  @media (max-width: 720px) { #tour .bubble { max-width: calc(100vw - 32px); box-sizing: border-box; } }
</style>

<body>
<div id="panel" class="panel">
  <h1 id="title">PIVOT scene</h1>
  <select id="sceneMenu" style="display:none" data-i18n-title="chooseRoom"></select>
  <div class="meta" id="meta"></div>
  <label><input type="checkbox" id="showPoints" checked> <span data-i18n="pointCloud">Point cloud</span></label>
  <label><input type="checkbox" id="showBoxes" checked> <span data-i18n="objectBoxes">Object boxes</span></label>
  <label><input type="checkbox" id="showVolumes" checked> <span data-i18n="objectVolumes">Object volumes</span></label>
  <label><input type="checkbox" id="showFloor" checked> <span data-i18n="walkableFloor">Walkable floor</span></label>
  <label><input type="checkbox" id="showLabels" checked> <span data-i18n="labels">Labels</span></label>
  <label><span data-i18n="cutAbove">Cut above</span> <span id="cutValue">2.0</span> m
    <input type="range" id="cut" min="0.3" max="4" step="0.1" value="2.0" style="width:100%"></label>
  <select id="languageMenu" data-i18n-title="language"></select>
</div>
<div id="controls" class="panel">
  <div id="moveSection">
  <h2 data-i18n="moveTitle">Move an object</h2>
  <div class="hint" data-i18n="moveHint"></div>
  <div class="row"><span class="key" data-i18n="object">Object</span><span id="selected"></span>
    <button id="deselect" style="display:none" data-i18n="change">Change</button></div>
  <div class="row"><span class="key" data-i18n="target">Target</span><span id="target"></span></div>
  <div class="row"><span class="key" data-i18n="rotation">Rotation</span>
    <input type="number" id="yaw" step="15" data-i18n-placeholder="keep"><span class="hint" data-i18n="degrees">degrees</span></div>
  <div class="grid two">
    <button id="check" disabled data-i18n="check">Check</button>
    <button id="move" class="primary" disabled data-i18n="move">Move</button>
  </div>
  <div class="grid three" id="editButtons">
    <button id="remove" disabled data-i18n="remove">Remove</button>
    <button id="undo" data-i18n="undo">Undo</button>
    <button id="reset" data-i18n="reset">Reset</button>
  </div>
  <div class="grid two" id="extraButtons">
    <button id="plan" data-i18n="planButton" data-i18n-title="planTitle">Moving plan (PDF)</button>
    <button id="photoButton" style="display:none" data-i18n="addPhoto" data-i18n-title="addPhotoTitle">Add from a photo</button>
  </div>
  <input type="file" id="photoInput" accept="image/*" style="display:none">
  <div id="result"></div>
  <div class="row"><button id="makeRoom" class="primary" style="display:none" data-i18n="makeRoom">Make room &amp; move</button></div>
  </div>
  <div id="chat">
    <h2 data-i18n="askTitle">Ask PIVOT</h2>
    <div class="hint" data-i18n="askHint"></div>
    <div id="chatLimits" class="hint"></div>
    <div id="chatLog"></div>
    <textarea id="chatInput" data-i18n-placeholder="askPlaceholder"></textarea>
    <div class="row"><button id="chatSend" class="primary" data-i18n="send">Send</button>
      <button id="chatMic" style="display:none" data-i18n="speak" data-i18n-title="micTitle">Speak</button>
      <label><input type="checkbox" id="chatAloud"> <span data-i18n="readAloud">Read answers aloud</span></label></div>
  </div>
</div>
<nav id="mobileNav">
  <button data-sheet="panel" data-i18n="navView">View</button>
  <button data-sheet="move" data-i18n="navMove" style="display:none">Move</button>
  <button data-sheet="chat" data-i18n="navAsk" style="display:none">Ask</button>
</nav>
<div id="tour"></div>
<div id="sizeDialog"><div class="card"></div></div>
<button id="tourButton" data-i18n-title="tourHelp">?</button>
<script>__PIVOT_LANGUAGES__</script>
<script id="scene-data" type="application/json">__PIVOT_SCENE_DATA__</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { Line2 } from "three/addons/lines/Line2.js";
import { LineGeometry } from "three/addons/lines/LineGeometry.js";
import { LineMaterial } from "three/addons/lines/LineMaterial.js";

const data = JSON.parse(document.getElementById("scene-data").textContent);

// Language: texts of the page, names of objects and rooms, voice. See i18n.js.
const I18n = window.PivotI18n;
let language = I18n.initialLanguage();
const t = (key, values) => I18n.text(language, key, values);
const nameOf = english => I18n.name(language, english);
const objectName = obj => `${nameOf(obj.label)} #${obj.id}`;
const translators = [];  // Re-run when the language changes.
function translatePage() {
  document.documentElement.lang = language;
  for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n);
  for (const node of document.querySelectorAll("[data-i18n-title]")) node.title = t(node.dataset.i18nTitle);
  for (const node of document.querySelectorAll("[data-i18n-placeholder]"))
    node.placeholder = t(node.dataset.i18nPlaceholder);
  translators.forEach(update => update());
}
const languageMenu = document.getElementById("languageMenu");
for (const [code, { name }] of Object.entries(I18n.LANGUAGES))
  languageMenu.add(new Option(name, code, false, code === language));
languageMenu.onchange = () => {
  language = languageMenu.value;
  I18n.remember(language);
  translatePage();
};
const decode = (b64, Type) => {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return new Type(bytes.buffer);
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
// Section plane hiding the ceiling, so the room is seen like a floor plan.
const cutPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 2.0);
renderer.clippingPlanes = [cutPlane];
document.body.appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.domElement.style.position = "absolute";
labels.domElement.style.top = "0";
labels.domElement.style.pointerEvents = "none";
labels.domElement.style.zIndex = "1";  // Under the panels' tour bubbles.
document.body.appendChild(labels.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111418);
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 100);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Point cloud. The points of each movable object are drawn apart and follow
// it: moved, the object takes its own look along; removed, it leaves no ghost.
const positions = decode(data.points, Float32Array);
const colors = decode(data.colors, Uint8Array);
const owners = data.owners ? decode(data.owners, Int32Array) : new Int32Array(positions.length / 3).fill(-1);
const ownedPoints = new Map();  // Object id -> indices of its points.
const fixedPoints = [];
owners.forEach((id, i) => {
  if (id < 0) { fixedPoints.push(i); return; }
  if (!ownedPoints.has(id)) ownedPoints.set(id, []);
  ownedPoints.get(id).push(i);
});
const pointMaterial = new THREE.PointsMaterial({ size: 0.025, vertexColors: true, sizeAttenuation: true });
// Points with indices, positions made relative to a frame (center and yaw) when given.
function pointsOf(indices, frame = null) {
  const xyz = new Float32Array(3 * indices.length), rgb = new Uint8Array(3 * indices.length);
  const [cx, cy, cz, yaw] = frame ?? [0, 0, 0, 0];
  const c = Math.cos(-yaw), s = Math.sin(-yaw);
  indices.forEach((i, k) => {
    const dx = positions[3 * i] - cx, dy = positions[3 * i + 1] - cy;
    xyz[3 * k] = c * dx - s * dy;
    xyz[3 * k + 1] = s * dx + c * dy;
    xyz[3 * k + 2] = positions[3 * i + 2] - cz;
    rgb.set(colors.subarray(3 * i, 3 * i + 3), 3 * k);
  });
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(xyz, 3));
  geometry.setAttribute("color", new THREE.BufferAttribute(rgb, 3, true));
  return new THREE.Points(geometry, pointMaterial);
}
const cloud = new THREE.Group();
const fixedCloud = pointsOf(fixedPoints);
cloud.add(fixedCloud);
scene.add(cloud);

// Walkable floor, drawn as a translucent texture just above z = 0.
const floorGroup = new THREE.Group();
if (data.floor) {
  const f = data.floor;
  const pixels = new Uint8Array(f.rows * f.cols * 4);
  // One tint per room when the capture covers several, the walkable green otherwise.
  const tints = [[76, 195, 138], [94, 156, 230], [232, 170, 72], [196, 120, 214],
                 [230, 110, 110], [120, 200, 210], [190, 200, 90]];
  f.cells.forEach((cols, row) => cols.forEach((col, k) => {
    const room = f.rooms ? f.rooms[row][k] : 0;
    const tint = room ? tints[(room - 1) % tints.length] : tints[0];
    pixels.set([...tint, 90], (row * f.cols + col) * 4);
  }));
  const texture = new THREE.DataTexture(pixels, f.cols, f.rows);
  texture.magFilter = THREE.NearestFilter;
  texture.needsUpdate = true;
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(f.cols * f.resolution, f.rows * f.resolution),
    new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false }));
  plane.position.set(f.origin[0] + f.cols * f.resolution / 2,
                     f.origin[1] + f.rows * f.resolution / 2, 0.005);
  floorGroup.add(plane);
  for (const room of data.rooms || []) {
    const tag = document.createElement("div");
    tag.className = "tag room";
    translators.push(() => { tag.textContent = nameOf(room.name); });
    const label = new CSS2DObject(tag);
    label.position.set(room.center[0], room.center[1], 0.05);
    floorGroup.add(label);
  }
}
scene.add(floorGroup);

// Objects: box edges with a label, a pickable invisible fill, and the volume
// each object actually occupies. All three follow the object's pose.
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(2, -3, 5);
scene.add(sun);
const boxGroup = new THREE.Group();
const volumeGroup = new THREE.Group();
const views = new Map();
const palette = ["#e5484d", "#3e63dd", "#46a758", "#f5d90a", "#8e4ec6", "#12a594",
                 "#f76b15", "#d6409f", "#0090ff", "#a18072"];
// Photos of the objects brought in from a photo, by id (shown in their labels).
const pictures = new Map();
const scannedIds = new Set(data.objects.map(o => o.id));
function addView(obj, i) {
  const color = new THREE.Color(palette[i % palette.length]);
  const [sx, sy, sz] = obj.box.size;
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(sx, sy, sz)),
    new THREE.LineBasicMaterial({ color }));
  const fill = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.0, depthWrite: false }));
  fill.userData.id = obj.id;
  edges.add(fill);
  const tag = document.createElement("div");
  tag.className = "tag";
  const nameTag = () => {
    tag.textContent = objectName(obj);
    if (pictures.has(obj.id)) {
      const thumbnail = document.createElement("img");
      thumbnail.src = pictures.get(obj.id);
      thumbnail.style.cssText = "display:block;max-width:64px;max-height:64px;margin:2px auto 0";
      tag.appendChild(thumbnail);
    }
  };
  translators.push(nameTag);
  nameTag();
  const label = new CSS2DObject(tag);
  label.position.set(0, 0, sz / 2 + 0.05);
  edges.add(label);
  boxGroup.add(edges);

  let cubes = null;
  if (obj.shape) {
    // Cells are in the box frame: one instanced cube per occupied cell.
    const r = obj.shape.resolution, cells = obj.shape.cells, count = cells.length / 3;
    cubes = new THREE.InstancedMesh(new THREE.BoxGeometry(r, r, r),
      new THREE.MeshLambertMaterial({ color }), count);
    const m = new THREE.Matrix4();
    for (let k = 0; k < count; k++) {
      m.makeTranslation((cells[3 * k] + 0.5) * r, (cells[3 * k + 1] + 0.5) * r,
                        (cells[3 * k + 2] + 0.5) * r);
      cubes.setMatrixAt(k, m);
    }
    volumeGroup.add(cubes);
  } else if (!scannedIds.has(obj.id)) {
    // Brought in (from a photo, or by the agent): no measured volume, a block of its size.
    cubes = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz),
                           new THREE.MeshLambertMaterial({ color }));
    volumeGroup.add(cubes);
  }

  let points = null;
  if (ownedPoints.has(obj.id)) {
    points = pointsOf(ownedPoints.get(obj.id), [...obj.box.center, obj.box.yaw]);
    cloud.add(points);
  }
  views.set(obj.id, { obj, edges, fill, cubes, points, label, z: obj.box.center[2], removed: false });
  setPose(obj.id, obj.box.center[0], obj.box.center[1], obj.box.yaw);
}
data.objects.forEach(addView);

// Drops the view of an object, to draw it again (its size was corrected).
function dropView(id) {
  const view = views.get(id);
  view.edges.remove(view.label);
  boxGroup.remove(view.edges);
  if (view.cubes) volumeGroup.remove(view.cubes);
  if (view.points) cloud.remove(view.points);
  views.delete(id);
}
scene.add(boxGroup);
scene.add(volumeGroup);

function setPose(id, x, y, yaw, z = null) {
  const view = views.get(id);
  if (z !== null) view.z = z;
  for (const node of [view.edges, view.cubes, view.points]) {
    if (!node) continue;
    node.position.set(x, y, view.z);
    node.rotation.z = yaw;
  }
}

function pose(id) {
  const edges = views.get(id).edges;
  return [edges.position.x, edges.position.y, edges.rotation.z];
}

// Back to picking an object: the next click selects instead of aiming.
function clearSelection() {
  selectedId = null;
  views.forEach(v => {
    v.fill.material.opacity = 0.0;
    if (v.cubes) {
      v.cubes.material.transparent = false;
      v.cubes.material.opacity = 1.0;
      v.cubes.material.depthWrite = true;
      v.cubes.material.needsUpdate = true;
    }
  });
  document.getElementById("selected").textContent = t("none");
  document.getElementById("deselect").style.display = "none";
  document.getElementById("remove").disabled = true;
  // Options apply to one move: the next object starts with the defaults.
  document.getElementById("yaw").value = "";
  setTarget(null);
}
window.addEventListener("keydown", e => {
  if (e.key === "Escape" && placing) stopPlacing();
  else if (e.key === "Escape" && data.interactive) clearSelection();
});

// Every request names this page's room; the server keeps one session per room.
const scoped = path => data.scene
  ? `${path}${path.includes("?") ? "&" : "?"}scene=${encodeURIComponent(data.scene)}` : path;

  menu.onchange = () => { location.href = `/?scene=${encodeURIComponent(menu.value)}`; };

for (const [id, group] of [["showPoints", cloud], ["showBoxes", boxGroup],

// Labels can crowd a small screen: off by default on phones.

// Phones: one drawer at a time, opened (and closed again) from the bottom bar.
let sheet = null;
// A drawer swiped down closes, as on any phone (from its top, or once scrolled to the top).
for (const drawer of [document.getElementById("panel"), document.getElementById("controls")]) {
  let startY = null, shift = 0;
  drawer.addEventListener("touchstart", event => {
    startY = drawer.scrollTop <= 0 ? event.touches[0].clientY : null;
    shift = 0;
  }, { passive: true });
  drawer.addEventListener("touchmove", event => {
    if (startY === null || !phone.matches) return;
    shift = Math.max(0, event.touches[0].clientY - startY);
    drawer.style.transform = shift ? `translateY(${shift}px)` : "";
  }, { passive: true });
  drawer.addEventListener("touchend", () => {
    drawer.style.transform = "";
    if (startY !== null && shift > 70 && sheet) openSheet(sheet);
    startY = null;
  });
}

function openSheet(name) {
  sheet = name === sheet ? null : name;
  for (const kind of ["panel", "move", "chat"]) document.body.classList.toggle(`sheet-${kind}`, sheet === kind);
  document.querySelectorAll("#mobileNav button").forEach(button =>
    button.classList.toggle("active", button.dataset.sheet === sheet));
}
document.querySelectorAll("#mobileNav button").forEach(button => {
  button.onclick = () => openSheet(button.dataset.sheet);
});
if (data.interactive) document.querySelector('#mobileNav [data-sheet="move"]').style.display = "";
if (data.chat) document.querySelector('#mobileNav [data-sheet="chat"]').style.display = "";
// While a motion plays, the drawer steps aside so that it can be watched.
async function watchMotions(play) {
  const open = phone.matches ? sheet : null;
  if (open) openSheet(open);
  try { await play(); } finally { if (open && sheet === null) openSheet(open); }
}

document.getElementById("cut").oninput = e => {
  cutPlane.constant = parseFloat(e.target.value);
  document.getElementById("cutValue").textContent = parseFloat(e.target.value).toFixed(1);

// ---------------------------------------------------------------------------
// Selection, and the controls that plan and execute moves (served mode only).
let selectedId = null;
let target = null;
const ghost = new THREE.Group();
// The planned path and the target are drawn over everything, so they stay
// visible under tables and through the point cloud: no depth test, and in the
// transparent pass, which is drawn last.
const pathMaterial = new LineMaterial({ color: 0xffe066, linewidth: 5, depthTest: false,
                                        transparent: true });
const pathLine = new Line2(new LineGeometry(), pathMaterial);
pathLine.renderOrder = 10;
pathLine.visible = false;
scene.add(ghost, pathLine);

function select(id) {
  selectedId = id;
  views.forEach((v, key) => {
    v.fill.material.opacity = key === id ? 0.25 : 0.0;
    // Focus: the other objects' volumes fade out.
    if (v.cubes) {
      v.cubes.material.transparent = key !== id;
      v.cubes.material.opacity = key === id ? 1.0 : 0.3;
      v.cubes.material.depthWrite = key === id;
      v.cubes.material.needsUpdate = true;  // Transparency changes the shader.
    }
  });
  const view = views.get(id);
  controls.target.set(view.edges.position.x, view.edges.position.y, view.z);
  document.getElementById("selected").textContent = objectName(view.obj);
  document.getElementById("deselect").style.display = data.interactive ? "" : "none";
  document.getElementById("remove").disabled = !data.interactive;
  setTarget(null);
}

function setTarget(point) {
  target = point;
  ghost.clear();
  pathLine.visible = false;
  document.getElementById("target").textContent =
    point ? `(${point.x.toFixed(2)}, ${point.y.toFixed(2)}) m` : t("none");
  const ready = data.interactive && selectedId !== null && point !== null;
  document.getElementById("check").disabled = !ready;
  document.getElementById("move").disabled = !ready;
  document.getElementById("makeRoom").style.display = "none";
  if (point) showGhost(point, requestedYaw() ?? pose(selectedId)[2]);
}

// Dashed outline of the selected object at a pose.
function showGhost(point, yaw) {
  ghost.clear();
  const view = views.get(selectedId);
  const [sx, sy, sz] = view.obj.box.size;
  const outline = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(sx, sy, sz)),
    new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.05, gapSize: 0.04,
                                   depthTest: false, transparent: true }));
  outline.renderOrder = 10;
  outline.computeLineDistances();
  outline.position.set(point.x, point.y, view.z);
  outline.rotation.z = yaw;
  ghost.add(outline);
}

function requestedYaw() {
  const value = document.getElementById("yaw").value;
  return value === "" ? null : THREE.MathUtils.degToRad(parseFloat(value));
}
document.getElementById("yaw").oninput = () => { if (target) setTarget(target); };

// A click (not a drag) picks an object, or a target on the floor.
const raycaster = new THREE.Raycaster();
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
let downAt = null;
renderer.domElement.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
function floorPoint(e) {
  const ndc = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1,
                                -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  return raycaster.ray.intersectPlane(floorPlane, new THREE.Vector3());
}
renderer.domElement.addEventListener("pointermove", e => {
  // The ghost follows the mouse until a click tries a spot; it then stays there (to make
  // room there, the mouse crosses the view to the panel), until another click.
  if (placing && !placing.pinned && e.pointerType === "mouse") {
    const p = floorPoint(e);
    if (p) movePlacing(p);
  }
});
// A right click drops the object being placed (Escape too); a right drag still pans.
renderer.domElement.addEventListener("contextmenu", e => { if (placing) e.preventDefault(); });
renderer.domElement.addEventListener("pointerup", e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  if (placing && e.button === 2) {
    stopPlacing();
    return;
  }
  if (placing) {
    // With a mouse, the ghost already follows: a click puts it. On a touch
    // screen, a tap shows it there, and a button confirms.
    const point = floorPoint(e);
    if (!point) return;
    movePlacing(point);
    placing.pinned = e.pointerType === "mouse";
    if (e.pointerType === "mouse") placeHere(); else placeHereButton.style.display = "";
    return;
  }
  const ndc = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1,
                                -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const fills = [...views.values()].filter(v => !v.removed).map(v => v.fill);
  // Without a selection, a click selects. With one, it aims, through objects
  // (under a table); ctrl-click selects another object.
  const selecting = selectedId === null || !data.interactive || e.ctrlKey || e.metaKey;
  // Door and window boxes are large and stand in front of the room: an object
  // under the cursor wins over them.
  const hits = selecting ? raycaster.intersectObjects(fills, false) : [];
  const isOpening = h => ["door", "window"].includes(views.get(h.object.userData.id).obj.label);
  const hit = hits.find(h => !isOpening(h)) ?? hits[0];
  if (hit) {
    select(hit.object.userData.id);
    return;
  }
  if (!data.interactive || selectedId === null) return;
  const point = raycaster.ray.intersectPlane(floorPlane, new THREE.Vector3());
  if (point) setTarget(point);
});

async function callTool(name, args) {
  const response = await fetch(scoped(`/api/tools/${name}`), {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(args) });
  return response.json();
}

function moveArguments() {
  // A click is approximate: accept the nearest feasible pose within 50 cm.
  const args = { object_id: selectedId, x: target.x, y: target.y, snap_m: 0.5 };
  // PIVOT slides the object, or carries it over the furniture (or onto a desk) when it is
  // light and small enough: a bin or a chair, not a sofa nor a floor lamp.
  args.auto_carry = true;
  const yaw = document.getElementById("yaw").value;
  if (yaw !== "") args.yaw_deg = parseFloat(yaw);
  return args;
}

// Server messages are in English: they are shown escaped, under a translated verdict.
const escapeHtml = s => String(s ?? "").replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
function describe(plan, moved) {
  if (plan.status === "success") {
    const lines = [`<span class="ok">${t(moved ? "moved" : "feasible")}</span>`,
      t("pathLine", { length: plan.path_length_m, rotation: plan.total_rotation_deg }),
      t("effortLine", { effort: plan.effort_m, clearance: plan.min_clearance_m === null
        ? t("overOneMeter") : `${Math.round(100 * plan.min_clearance_m)} cm` })];
    if (plan.rolled_up) lines.push(t("rolledUp"));
    return lines.join("\n");
  }
  const reason = t(`status_${plan.status}`);
  return `<span class="no">${t("notPossible")} (${escapeHtml(reason)})</span>\n` +
    `<span class="hint">${escapeHtml(plan.message)}</span>`;
}

// Warnings come in English, e.g. "stands in front of the door (#26)".
function warningText(warning) {
  const front = /^stands in front of the (.+) \(#(\d+)\)$/.exec(warning);
  return front ? t("inFront", { label: nameOf(front[1]), id: front[2] })
    : t("note", { warning });
}

function drawPath(waypoints) {
  pathLine.geometry = new LineGeometry();
  pathLine.geometry.setPositions(waypoints.flatMap(([x, y]) => [x, y, 0.02]));
  pathLine.computeLineDistances();
  pathLine.visible = true;
}

const result = document.getElementById("result");
let busy = false;
// While the server computes, a counter shows that it is still working.
let ticking = null;
function startTimer(node, key) {
  const start = performance.now();
  const show = () => {
    node.textContent = `${t(key)} ${Math.round((performance.now() - start) / 1000)} s`;
  };
  show();
  clearInterval(ticking);
  ticking = setInterval(show, 1000);
}
function stopTimer() {
  clearInterval(ticking);
  ticking = null;
}
// A click during a computation is not lost silently: the page says to wait.
function stillBusy() {
  if (!busy) return false;
  if (!result.querySelector(".wait")) {
    const wait = document.createElement("div");
    wait.className = "hint wait";
    wait.textContent = t("stillWorking");
    result.appendChild(wait);
  }
  return true;
}
async function run(name) {
  if (stillBusy()) return;
  busy = true;
  startTimer(result, "planning");
  try {
    const answer = await callTool(name, moveArguments());
    stopTimer();
    if (answer.error) {
      result.innerHTML = `<span class="no">${t("error")}</span>\n${escapeHtml(answer.error)}`;
      return;
    }
    const plan = name === "move_object" ? answer.plan : answer;
    result.innerHTML = describe(plan, name === "move_object" && answer.moved);
    for (const warning of answer.warnings || []) result.innerHTML += `\n${escapeHtml(warningText(warning))}`;
    const adjusted = answer.goal_adjusted;
    if (adjusted) {
      result.innerHTML += "\n" + t("adjusted", { cm: Math.round(100 * adjusted.shift_m) });
      showGhost(new THREE.Vector3(adjusted.x, adjusted.y, 0),
                THREE.MathUtils.degToRad(adjusted.yaw_deg));
    }
    if (plan.waypoints) drawPath(plan.waypoints);
    if (name === "move_object" && answer.moved) {
      await watchMotions(() => animate(selectedId, answer.carried_along || [], plan.waypoints,
                                       plan.rolled_up));
      applyObjects(answer.objects);
      clearSelection();
    } else if (plan.status !== "success") {
      await suggestMakingRoom();
    }
  } finally {
    stopTimer();
    busy = false;
  }
}

// When the object cannot get there, check whether moving others aside would help.
const makeRoomButton = document.getElementById("makeRoom");
async function suggestMakingRoom() {
  const looking = document.createElement("div");
  result.appendChild(looking);
  startTimer(looking, "lookingForRoom");
  const preview = await callTool("make_room", moveArguments());
  stopTimer();
  looking.remove();
  if (preview.success && preview.blockers.length) {
    result.innerHTML += `\n\n<span class="ok">${escapeHtml(preview.message)}</span>`;
    makeRoomButton.style.display = "";
  } else if (preview.message) {
    result.innerHTML += `\n\n${escapeHtml(preview.message)}`;
  }
}

makeRoomButton.onclick = async () => {
  if (stillBusy()) return;
  busy = true;
  makeRoomButton.style.display = "none";
  startTimer(result, "planning");
  try {
    const answer = await callTool("make_room_and_move", moveArguments());
    stopTimer();
    if (!answer.moved) {
      result.innerHTML = `<span class="no">${t("notPossible")}</span>\n${escapeHtml(answer.message)}`;
      return;
    }
    result.innerHTML = `<span class="ok">${t("moved")}</span>\n${escapeHtml(answer.message)}`;
    await watchMotions(async () => {
      for (const step of answer.steps) {
        drawPath(step.waypoints);
        await animate(step.object_id, step.carried_along || [], step.waypoints, step.rolled_up);
      }
    });
    applyObjects(answer.objects);
    clearSelection();
  } finally {
    stopTimer();
    busy = false;
  }
};
document.getElementById("deselect").onclick = clearSelection;
document.getElementById("check").onclick = () => run("plan_motion");
document.getElementById("move").onclick = () => run("move_object");
// Takes the selected object out of the room (to replace it with another one, say).
async function removeSelected() {
  if (selectedId === null || stillBusy()) return;
  busy = true;
  try {
    const view = views.get(selectedId);
    const answer = await callTool("remove_object", { object_id: selectedId });
    if (!answer.removed) {
      result.innerHTML = `<span class="no">${t("notPossible")}</span>\n` +
        escapeHtml(answer.reason ?? answer.error);
      return;
    }
    applyObjects(answer.objects);
    clearSelection();
    result.textContent = t("removed", { name: objectName(view.obj) });
    if (answer.removed_with.length) {
      result.textContent += " " + t("removedWith", { names: answer.removed_with
        .map(o => objectName({ label: o.label, id: o.id })).join(", ") });
    }
  } finally {
    busy = false;
  }
}
document.getElementById("remove").onclick = removeSelected;
document.getElementById("undo").onclick = async () => {
  if (stillBusy()) return;
  const answer = await callTool("undo", {});
  result.textContent = answer.undone ? t("undone") : answer.reason;
  if (answer.objects) applyObjects(answer.objects);
};
document.getElementById("reset").onclick = async () => {
  if (stillBusy()) return;
  const objects = await (await fetch(scoped("/api/reset"), { method: "POST" })).json();
  applyObjects(objects);
  clearSelection();
  chatLog.textContent = "";  // The server starts a new conversation too.
  result.textContent = t("sceneReset");
};

function applyObjects(objects) {
  // Objects taken out of the room are hidden, with their points and label; undo shows them again.
  const present = new Set(objects.map(o => o.id));
  views.forEach((view, id) => {
    view.removed = !present.has(id);
    for (const node of [view.edges, view.cubes, view.points, view.label])
      if (node) node.visible = !view.removed;
  });
  for (const obj of objects) {
    const known = views.get(obj.id);
    if (known && known.obj.box.size.some((v, k) => Math.abs(v - obj.box.size[k]) > 1e-6)) {
      dropView(obj.id);
    }
    if (!views.has(obj.id)) addView(obj, obj.id);  // Brought in, or resized.
    views.get(obj.id).z = obj.box.center[2];
    setPose(obj.id, obj.box.center[0], obj.box.center[1], obj.box.yaw);
  }
}

// Squeezes an object along its long side: a rug rolls up (factor < 1) or out (1).
function setRoll(id, factor) {
  const size = views.get(id).obj.box.size;
  const long = size[0] >= size[1] ? 0 : 1;
  const view = views.get(id);
  for (const node of [view.edges, view.cubes, view.points]) {
    if (node) node.scale.set(long === 0 ? factor : 1, long === 1 ? factor : 1, 1);
  }
}

// Plays a verified motion: the object follows the waypoints (translations,
// in-place turns, lifts and lowerings), and what it carries moves rigidly with it.
// A rug that travels rolled up rolls up first and unrolls at the end.
function animate(id, carried, waypoints, rolledUp = false) {
  const [x0, y0, yaw0] = pose(id);
  const height = views.get(id).obj.box.size[2];
  const z0 = views.get(id).z;
  const riders = carried.map(child => {
    const [cx, cy, cyaw] = pose(child);
    const dx = cx - x0, dy = cy - y0;
    return { child, u: Math.cos(-yaw0) * dx - Math.sin(-yaw0) * dy,
             v: Math.sin(-yaw0) * dx + Math.cos(-yaw0) * dy, dyaw: cyaw - yaw0,
             dz: views.get(child).z - z0 };
  });
  // Waypoints are [x, y, yaw in degrees, bottom height]; poses use the center height.
  const steps = [];
  let previous = [waypoints[0][0], waypoints[0][1], yaw0, z0];
  for (const [x, y, yawDeg, bottom] of waypoints.slice(1)) {
    // Turn as the planner checked it: a box is the same after a half turn, so
    // the turn between two waypoints is at most 90 degrees either way. Turning
    // "the short way" over a full circle could swing a long object through a
    // wall the planned motion never touches.
    const turn = THREE.MathUtils.degToRad(yawDeg) - previous[2];
    const yaw = previous[2] + turn - Math.PI * Math.round(turn / Math.PI);
    const z = bottom + height / 2;
    const seconds = Math.max(Math.hypot(x - previous[0], y - previous[1]) / 0.6,
                             Math.abs(yaw - previous[2]) / (Math.PI / 2),
                             Math.abs(z - previous[3]) / 0.4, 0.05);
    steps.push({ from: previous, to: [x, y, yaw, z], seconds });
    previous = [x, y, yaw, z];
  }
  let roll = [1, 1];
  if (rolledUp) {
    const size = views.get(id).obj.box.size;
    roll = [1, Math.min(1, 0.3 / Math.max(size[0], size[1]))];
    steps.forEach(step => { step.roll = [roll[1], roll[1]]; });
    steps.unshift({ from: steps[0].from, to: steps[0].from, seconds: 0.8, roll });
    const end = steps[steps.length - 1].to;
    steps.push({ from: end, to: end, seconds: 0.8, roll: [roll[1], 1] });
  }
  return new Promise(resolve => {
    let index = 0, start = performance.now();
    function frame(now) {
      const step = steps[index];
      const t = Math.min((now - start) / (1000 * step.seconds), 1);
      const [x, y, yaw, z] = step.from.map((a, k) => a + t * (step.to[k] - a));
      setPose(id, x, y, yaw, z);
      if (step.roll) setRoll(id, step.roll[0] + t * (step.roll[1] - step.roll[0]));
      for (const r of riders) {
        setPose(r.child, x + Math.cos(yaw) * r.u - Math.sin(yaw) * r.v,
                y + Math.sin(yaw) * r.u + Math.cos(yaw) * r.v, yaw + r.dyaw, z + r.dz);
      }
      if (t < 1) return requestAnimationFrame(frame);
      index += 1;
      start = now;
      if (index < steps.length) return requestAnimationFrame(frame);
      resolve();
    }
    if (steps.length) requestAnimationFrame(frame); else resolve();
  });
}

if (data.interactive) document.getElementById("controls").style.display = "block";
document.getElementById("plan").onclick =
  () => window.open(scoped(`/instructions?pdf=1&lang=${language}`), "_blank");

// Requests in words: the agent answers, and the moves it made are played back.
const chatLog = document.getElementById("chatLog");
function chatLine(cls, text) {
  const line = document.createElement("div");
  line.className = cls;
  line.textContent = text;
  chatLog.appendChild(line);
  chatLog.scrollTop = chatLog.scrollHeight;
  return line;
}
async function sendChat() {
  const input = document.getElementById("chatInput");
  const message = input.value.trim();
  if (!message || busy) return;
  busy = true;
  input.value = "";
  chatLine("user", message);
  const pending = chatLine("agent", t("thinking"));
  // A request may take a minute: say what the agent is checking meanwhile.
  const watch = setInterval(() => showProgress(pending), 1500);
  try {
    const answer = await (await fetch(scoped("/api/chat"), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, language }) })).json();
    clearInterval(watch);
    if (answer.error) { pending.textContent = answer.error; return; }
    pending.textContent = answer.answer;
    speak(answer.answer);
    if (answer.steps.length) chatLine("tools", t("checkedCount", { n: answer.steps.length }));
    clearSelection();
    await watchMotions(async () => {
      for (const motion of answer.motions) {
        drawPath(motion.waypoints);
        await animate(motion.object_id, motion.carried_along, motion.waypoints, motion.rolled_up);
      }
    });
    applyObjects(answer.objects);
  } finally {
    clearInterval(watch);
    busy = false;
    showLimits();
  }
}

// What the agent is doing, in words: the last tool call of the request so far.
const PROGRESS = { list_objects: "progressLook", find_objects: "progressLook",
  plan_motion: "progressPath", move_object: "progressPath", plan_to_room: "progressPath",
  move_to_room: "progressPath", make_room: "progressRoom", make_room_and_move: "progressRoom",
  check_placement: "progressSpot", propose_placements: "progressSpot", add_object: "progressSpot",
  check_access: "progressAccess", measure_gap: "progressMeasure", make_way: "progressWay" };
async function showProgress(line) {
  let steps;
  try { steps = (await (await fetch(scoped("/api/progress"))).json()).steps; } catch { return; }
  if (!busy || !steps || !steps.length || !line.isConnected) return;

// Answers read aloud by the browser's own voice (no server, no cost): on
// glasses, there is no screen to read them from.

function loadVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }

  loadVoices();

function utterance(text) {
  const lang = I18n.LANGUAGES[language].speech;
  const said = new SpeechSynthesisUtterance(text);
  said.lang = lang;
  // A voice of the page's language, when the browser has one.
  const voice = voices.find(v => v.lang.replace("_", "-") === lang)
    || voices.find(v => v.lang.startsWith(lang.split("-")[0]));
  if (voice) said.voice = voice;

}
function speak(text) {
  if (!aloud.checked || !window.speechSynthesis || !text) return;
  if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  // Sentence by sentence: Chrome stops a long utterance after about 15 seconds. Spoken a
  // moment after the cancel, which Chrome otherwise applies to the new words too.
  const sentences = text.match(/[^.!?。！？]+[.!?。！？]*/g) || [text];
  setTimeout(() => {
    for (const sentence of sentences) if (sentence.trim()) speechSynthesis.speak(utterance(sentence.trim()));
    speechSynthesis.resume();

}
// Ticking the box speaks a short sentence: phones only let a page speak after a tap, and

    chatLine("tools", t("noVoice"));

});

// Spoken requests: the microphone is recorded as 16 kHz mono 16-bit WAV (what
// the transcription models take), sent to the server, and the text is sent
// to the agent like a typed request.
const mic = document.getElementById("chatMic");
let recording = null;
function wavBytes(chunks, rate) {
  const length = chunks.reduce((n, c) => n + c.length, 0);
  const input = new Float32Array(length);
  let offset = 0;
  for (const chunk of chunks) { input.set(chunk, offset); offset += chunk.length; }
  const target = 16000, count = Math.floor(length * target / rate);
  const view = new DataView(new ArrayBuffer(44 + 2 * count));
  const text = (at, s) => [...s].forEach((c, i) => view.setUint8(at + i, c.charCodeAt(0)));
  text(0, "RIFF"); view.setUint32(4, 36 + 2 * count, true); text(8, "WAVEfmt ");
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, target, true); view.setUint32(28, 2 * target, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true); text(36, "data");
  view.setUint32(40, 2 * count, true);
  for (let i = 0; i < count; i++) {
    const x = i * rate / target, j = Math.floor(x), f = x - j;  // Linear resampling.
    const v = (1 - f) * input[j] + f * (input[Math.min(j + 1, length - 1)] || 0);
    view.setInt16(44 + 2 * i, Math.max(-1, Math.min(1, v)) * 32767, true);
  }
  return view.buffer;
}
async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const context = new AudioContext();
  const source = context.createMediaStreamSource(stream);
  const processor = context.createScriptProcessor(4096, 1, 1);
  const chunks = [];
  processor.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  source.connect(processor);
  processor.connect(context.destination);
  recording = { stream, context, processor, chunks };
  mic.classList.add("recording");
  mic.textContent = t("stop");
}
async function stopRecording() {
  const { stream, context, processor, chunks } = recording;
  recording = null;
  processor.disconnect();
  stream.getTracks().forEach(t => t.stop());
  await context.close();
  mic.classList.remove("recording");
  mic.textContent = t("transcribing");
  mic.disabled = true;
  try {
    const result = await (await fetch(scoped(`/api/transcribe?lang=${language}`), {
      method: "POST", headers: { "Content-Type": "audio/wav" },
      body: wavBytes(chunks, context.sampleRate) })).json();
    if (result.error) { chatLine("agent", result.error); return; }
    if (!result.text) { chatLine("agent", t("heardNothing")); return; }
    aloud.checked = true;  // Asked by voice, answered by voice.
    document.getElementById("chatInput").value = result.text;
    await sendChat();
  } finally {
    mic.textContent = t("speak");
    mic.disabled = false;
  }
}
mic.onclick = async () => {
  try {
    if (recording) await stopRecording(); else await startRecording();
  } catch (error) {
    chatLine("agent", t("micUnavailable") + error.message);
  }
};

// Objects from a photo: taken with the camera or picked from the gallery, the
// photo is shrunk, sent, and the object appears at the free spot nearest to the
// target (or the middle of the floor), with its estimated size to correct.
const photoButton = document.getElementById("photoButton");
const photoInput = document.getElementById("photoInput");
function shrunkPhoto(file, longest = 1280) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => {
      const scale = Math.min(1, longest / Math.max(image.width, image.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(image.width * scale);
      canvas.height = Math.round(image.height * scale);
      canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(image.src);
      resolve(canvas.toDataURL("image/jpeg", 0.9));
    };
    image.onerror = reject;
    image.src = URL.createObjectURL(file);
  });
}
async function addFromPhoto(file) {
  if (!file || stillBusy()) return;
  busy = true;
  photoButton.disabled = true;
  result.textContent = t("analyzing");
  try {
    const image = await shrunkPhoto(file);
    const ask = async body => (await fetch(scoped("/api/photo"), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image, ...body }) })).json();
    let answer = await ask({});
    // Several objects in the photo: the visitor picks one, then only that one is cut out.
    if (answer.choices) {
      const choice = await chooseObject(answer.choices);
      if (!choice) {
        result.textContent = "";
        return;
      }
      result.textContent = t("analyzing");
      answer = await ask({ choice });
    }
    if (answer.error || !answer.recognized) {
      const why = answer.reason === "no_object" ? t("noObjectInPhoto")
        : escapeHtml(answer.error ?? answer.reason);
      result.innerHTML = `<span class="no">${t("notPossible")}</span>\n${why}`;
      return;
    }
    const size = await confirmSize(answer);
    if (size) startPlacing({ ...answer, size_m: size });
    else result.textContent = "";
  } catch (error) {
    result.innerHTML = `<span class="no">${t("error")}</span>\n${escapeHtml(error.message)}`;
  } finally {
    busy = false;
    photoButton.disabled = false;
    photoInput.value = "";
    showLimits();
  }
}

// The ghost is grey until the server has checked the spot (the same check as

function drawPlacing(free = null, hung = null) {
  placeGhost.clear();

  // A wall object (a painting) is drawn where the server would hang it.
  const [sx, sy, sz] = hung ? hung.size_m : placing.size;
  const color = free === null ? 0xb0b8c0 : free ? 0x4cc38a : 0xe5484d;
  const box = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), new THREE.MeshBasicMaterial(
    { color, transparent: true, opacity: 0.35, depthTest: false }));
  box.add(new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry),
    new THREE.LineBasicMaterial({ color, depthTest: false })));
  box.renderOrder = 11;
  box.position.set(hung ? hung.x : placing.at.x, hung ? hung.y : placing.at.y, hung ? hung.z : sz / 2);
  box.rotation.z = hung ? THREE.MathUtils.degToRad(hung.yaw_deg) : placing.yaw;

}

async function placeHere(makeRoom = false) {

      depth_m: depth, height_m: height, x: placing.at.x, y: placing.at.y,
      yaw_deg: THREE.MathUtils.radToDeg(placing.yaw), make_room: makeRoom });

      result.querySelectorAll(".placeFail").forEach(node => node.remove());

// First-visit tour: a few speech bubbles, each pointing at one part of the page.
const tour = document.getElementById("tour");
const TOUR_KEY = "pivot.tourSeen";
function tourSteps() {
  const shown = id => document.getElementById(id).offsetParent !== null;
  const steps = [{ text: "tour1" }, { text: "tour2", target: "panel", side: "left", sheet: "panel" }];
  if (data.interactive) {
    steps.push({ text: "tour3", target: "controls", side: "right", sheet: "move" },
               { text: "tourEdit", target: "editButtons", side: "right", sheet: "move" });
    if (document.getElementById("photoButton").style.display !== "none")
      steps.push({ text: "tourPhoto", target: "photoButton", side: "right", sheet: "move" });
    steps.push({ text: "tourPlan", target: "plan", side: "right", sheet: "move" });
  }
  if (data.chat && (phone.matches || shown("chat")))
    steps.push({ text: "tour4", target: "chat", side: "right", sheet: "chat" });
  return steps;
}
function showTour(index = 0) {
  const steps = tourSteps();
  document.querySelectorAll(".tour-focus, .tour-raise")
    .forEach(node => node.classList.remove("tour-focus", "tour-raise"));
  // On a phone, each step opens the drawer it talks about.
  if (phone.matches) {
    const wanted = steps[index]?.sheet ?? null;
    if (sheet !== wanted) openSheet(wanted ?? sheet);
  }
  if (index >= steps.length) {
    tour.style.display = "none";
    try { localStorage.setItem(TOUR_KEY, "1"); } catch { /* Shown again next time. */ }
    return;
  }
  const step = steps[index], last = index === steps.length - 1;
  tour.style.display = "block";
  tour.innerHTML = "";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  const words = document.createElement("div");
  words.textContent = t(step.text);
  const row = document.createElement("div");
  row.className = "steps";
  const dots = document.createElement("span");
  dots.className = "dots";
  dots.textContent = steps.map((_, k) => (k === index ? "●" : "○")).join("");
  const skip = document.createElement("button");
  skip.textContent = t("tourSkip");
  skip.onclick = () => showTour(steps.length);
  const next = document.createElement("button");
  next.className = "primary";
  next.textContent = t(last ? "tourDone" : "tourNext");
  next.onclick = () => showTour(index + 1);
  row.append(dots, ...(last ? [] : [skip]), next);
  bubble.append(words, row);
  tour.appendChild(bubble);
  if (!step.target) {
    // The 3D view: the bubble points down at the middle of the room.
    bubble.classList.add("down");
    // Centered on the room, but never past the edge of a narrow screen.
    bubble.style.left = `${Math.max(16, Math.min(window.innerWidth / 2 - 40,
                                                 window.innerWidth - bubble.offsetWidth - 16))}px`;
    bubble.style.top = `${Math.max(16, window.innerHeight / 2 - bubble.offsetHeight - 30)}px`;
    return;
  }
  const target = document.getElementById(step.target);
  target.classList.add("tour-focus");
  target.closest(".panel").classList.add("tour-raise");
  if (phone.matches) {
    // The drawer fills the bottom of the screen: the bubble goes above it.
    bubble.style.left = "16px";
    bubble.style.top = "16px";
    return;
  }
  const box = target.getBoundingClientRect();
  const top = Math.min(Math.max(16, box.top + 8), window.innerHeight - bubble.offsetHeight - 16);
  bubble.style.top = `${top}px`;
  // The bubble stands beside the whole panel, not just the button it points at, and its
  // real width (padding and border included) keeps its tail clear of the panel.
  const side = target.closest(".panel").getBoundingClientRect();
  const outer = bubble.offsetWidth;
  if (step.side === "left" && side.right + outer + 40 < window.innerWidth) {
    bubble.classList.add("left");
    bubble.style.left = `${side.right + 22}px`;
  } else if (side.left - outer - 40 > 0) {
    bubble.classList.add("right");
    bubble.style.left = `${side.left - outer - 22}px`;
  } else {
    // A narrow screen: no room beside the panel, the bubble goes over it.
    bubble.style.left = "16px";
  }
}
document.getElementById("tourButton").onclick = () => showTour(0);
window.addEventListener("resize", () => { if (tour.style.display === "block") showTour(0); });
languageMenu.addEventListener("change", () => {
  if (tour.style.display === "block") showTour(0);
});
let tourSeen = false;
try { tourSeen = localStorage.getItem(TOUR_KEY) === "1"; } catch { /* Shown each time. */ }
if (!tourSeen) showTour(0);

// Frame the scene from above at an angle.
fixedCloud.geometry.computeBoundingBox();
const bounds = fixedCloud.geometry.boundingBox;
const center = bounds.getCenter(new THREE.Vector3());
const extent = bounds.getSize(new THREE.Vector3()).length();
controls.target.set(center.x, center.y, 0.5);
camera.position.set(center.x - 0.4 * extent, center.y - 0.6 * extent, 0.7 * extent);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  labels.setSize(w, h);
  pathMaterial.resolution.set(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
});
</script>
</body>
